<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#151826" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TutorNote" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>TutorNote</title>
  <link rel="icon" href="icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <style>
:root {
  --bg: #f4f5fa;
  --surface: rgba(255,255,255,.92);
  --surface-2: #fff;
  --text: #151826;
  --muted: #73788d;
  --line: #e6e8f0;
  --primary: #6757e8;
  --primary-2: #8c7df1;
  --primary-soft: #eeebff;
  --success: #248a62;
  --success-soft: #e7f7ef;
  --warning: #b96f17;
  --warning-soft: #fff4df;
  --danger: #bf4052;
  --danger-soft: #ffe9ed;
  --shadow: 0 12px 30px rgba(34, 39, 62, .08);
  --radius: 24px;
  --radius-sm: 16px;
  --nav-h: 78px;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 88% 0%, rgba(103,87,232,.12), transparent 27%),
    var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
}
button, input, select, textarea { font: inherit; }
button, [role="button"], .lesson, .student, .payment, .event-chip { touch-action: manipulation; -webkit-touch-callout: none; }
button { -webkit-appearance: none; appearance: none; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell { width: min(100%, 720px); min-height: 100dvh; margin: 0 auto; position: relative; }
.topbar {
  position: sticky; top: 0; z-index: 15;
  display: flex; justify-content: space-between; align-items: center;
  padding: max(16px, env(safe-area-inset-top)) 18px 12px;
  background: linear-gradient(180deg, rgba(244,245,250,.97), rgba(244,245,250,.86), rgba(244,245,250,0));
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.topbar h1 { margin: 2px 0 0; font-size: 25px; letter-spacing: -.04em; }
.eyebrow { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn, .avatar-btn {
  width: 42px; height: 42px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.88);
  color: var(--text); display: grid; place-items: center; font-size: 21px; box-shadow: 0 7px 18px rgba(28,31,48,.05); cursor: pointer;
}
.avatar-btn { background: var(--text); color: white; border: 0; font-size: 12px; font-weight: 900; }

.content { padding: 4px 16px calc(var(--nav-h) + 78px + env(safe-area-inset-bottom)); }
.section { margin-bottom: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 10px; }
.section-head h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
.section-head button { border: 0; background: transparent; color: var(--primary); font-weight: 800; cursor: pointer; }

.hero {
  background: linear-gradient(135deg, #171b2c 0%, #26274b 62%, #5e50d8 140%);
  color: white; border-radius: 28px; padding: 20px; box-shadow: 0 18px 42px rgba(34,39,62,.18); overflow: hidden; position: relative;
}
.hero::after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; right:-45px; top:-55px; background:rgba(255,255,255,.08); }
.hero-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; position: relative; z-index: 1; }
.hero .label { color: #c6c8dd; font-size: 13px; font-weight: 700; }
.hero .big-number { font-size: 34px; font-weight: 900; letter-spacing: -.05em; margin: 4px 0 0; }
.hero .pill { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.12); padding: 8px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
.hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; position: relative; z-index: 1; }
.hero-stat { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.07); border-radius: 16px; padding: 12px; }
.hero-stat strong { display: block; font-size: 17px; margin-top: 2px; }
.hero-stat small { color: #c9cbe0; }

.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { background: var(--surface); border: 1px solid rgba(225,227,237,.88); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.metric-card .metric-icon { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 900; margin-bottom: 18px; }
.metric-card strong { font-size: 24px; letter-spacing: -.04em; display: block; }
.metric-card small { color: var(--muted); font-weight: 700; }

.lesson-list, .student-list, .payment-list { display: grid; gap: 9px; }
.lesson, .student, .payment {
  display: flex; align-items: center; gap: 12px; padding: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; cursor: pointer;
}
.lesson-time { width: 54px; flex: 0 0 54px; font-weight: 900; color: var(--primary); font-size: 14px; }
.lesson-main, .student-main, .payment-main { min-width: 0; flex: 1; }
.lesson-main strong, .student-main strong, .payment-main strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lesson-main small, .student-main small, .payment-main small { color: var(--muted); display: block; margin-top: 3px; }
.avatar { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 900; flex: 0 0 42px; }
.amount { font-weight: 900; white-space: nowrap; }
.chev { color: #a6a9b8; font-size: 20px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); flex: 0 0 auto; }
.status-dot.planned { background: var(--primary); }
.status-dot.cancelled { background: var(--danger); }

.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 2px 0 14px; }
.day-chip { border: 1px solid var(--line); background: rgba(255,255,255,.8); border-radius: 16px; padding: 9px 3px; text-align: center; cursor: pointer; color: var(--muted); }
.day-chip small { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; }
.day-chip strong { display: block; margin-top: 4px; color: var(--text); }
.day-chip.active { background: var(--text); border-color: var(--text); color: #cfd1dc; }
.day-chip.active strong { color: white; }
.day-chip.today:not(.active) { border-color: var(--primary-2); }

.timeline { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.timeline-row { min-height: 66px; display: grid; grid-template-columns: 58px 1fr; border-bottom: 1px solid var(--line); }
.timeline-row:last-child { border-bottom: 0; }
.timeline-hour { padding: 11px 8px; color: var(--muted); font-size: 11px; font-weight: 800; border-right: 1px solid var(--line); }
.timeline-events { padding: 6px 8px; display: grid; gap: 5px; }
.event-chip { background: var(--primary-soft); color: #4436bd; border-left: 4px solid var(--primary); border-radius: 10px; padding: 7px 9px; font-size: 12px; cursor: pointer; }
.event-chip strong { display: block; font-size: 12px; }
.event-chip.cancelled { background: var(--danger-soft); color: #9d3041; border-left-color: var(--danger); }

.toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
.search { flex: 1; border: 1px solid var(--line); border-radius: 16px; background: white; padding: 12px 14px; outline: 0; color: var(--text); }
.search:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-soft); }
.primary-btn, .secondary-btn, .danger-btn {
  border: 0; border-radius: 16px; padding: 12px 15px; font-weight: 900; cursor: pointer;
}
.primary-btn { color: white; background: var(--primary); box-shadow: 0 8px 18px rgba(103,87,232,.22); }
.secondary-btn { background: var(--primary-soft); color: var(--primary); }
.danger-btn { background: var(--danger-soft); color: var(--danger); }
.full { width: 100%; }

.segmented { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 4px; border-radius: 15px; background: #e9ebf2; margin-bottom: 12px; }
.segmented button { border: 0; background: transparent; border-radius: 11px; padding: 9px 5px; color: var(--muted); font-weight: 800; cursor: pointer; }
.segmented button.active { background: white; color: var(--text); box-shadow: 0 3px 10px rgba(38,43,66,.08); }

.chart { display: flex; gap: 7px; height: 146px; align-items: end; padding-top: 10px; }
.bar-wrap { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; }
.bar { width: 100%; min-height: 4px; border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--primary-2), var(--primary)); }
.bar-wrap small { color: var(--muted); font-size: 9px; font-weight: 800; }

.empty { text-align: center; padding: 28px 18px; background: rgba(255,255,255,.7); border: 1px dashed #d8dae5; border-radius: 22px; color: var(--muted); }
.empty .empty-icon { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 18px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 25px; }
.empty strong { color: var(--text); display: block; margin-bottom: 4px; }

.setting-group { background: white; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-bottom: 12px; }
.setting-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px; border: 0; border-bottom: 1px solid var(--line); background: white; text-align: left; cursor: pointer; color: var(--text); }
.setting-row:last-child { border-bottom: 0; }
.setting-row small { color: var(--muted); display: block; margin-top: 2px; }
.setting-row .setting-title { font-weight: 800; }

.fab { position: fixed; z-index: 20; right: max(20px, calc((100vw - 720px)/2 + 20px)); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 20px; border: 0; background: var(--primary); color: white; font-size: 30px; box-shadow: 0 14px 32px rgba(103,87,232,.34); cursor: pointer; }
.bottom-nav { position: fixed; z-index: 18; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%,720px); height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding: 8px 8px max(8px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5,1fr); gap: 3px; background: rgba(255,255,255,.94); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.nav-item { border: 0; background: transparent; color: #9397a8; display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 16px; cursor: pointer; }
.nav-item span { font-size: 20px; height: 25px; }
.nav-item small { font-size: 10px; font-weight: 800; }
.nav-item.active { color: var(--primary); background: var(--primary-soft); }

.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(17,20,32,.46); display: flex; align-items: flex-end; justify-content: center; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.modal-backdrop.hidden { display: none; }
.modal { width: min(100%,720px); max-height: 92vh; max-height: 92dvh; overflow: auto; background: #fafbfe; border-radius: 28px 28px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px rgba(20,23,37,.18); }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal h2 { margin: 3px 0 0; font-size: 22px; }
.form-grid { display: grid; gap: 11px; }
.form-grid.two { grid-template-columns: 1fr 1fr; }
.field { display: grid; gap: 6px; }
.field label { color: var(--muted); font-weight: 800; font-size: 12px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: white; color: var(--text); border-radius: 14px; padding: 12px 13px; outline: 0; }
.field textarea { min-height: 95px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-soft); }
.form-actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-top: 14px; }

.profile-head { display: flex; gap: 14px; align-items: center; margin-bottom: 15px; }
.profile-avatar { width: 62px; height: 62px; border-radius: 20px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 22px; font-weight: 900; }
.profile-head h3 { margin: 0; font-size: 20px; }
.profile-head p { margin: 4px 0 0; color: var(--muted); }
.profile-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:12px 0; }
.profile-stat { background:white; border:1px solid var(--line); border-radius:15px; padding:10px; }
.profile-stat small { color:var(--muted); display:block; font-size:10px; font-weight:800; }
.profile-stat strong { display:block; margin-top:3px; }
.note-box { background: #fffbe9; border: 1px solid #f2e7ad; border-radius: 16px; padding: 13px; color: #746522; white-space: pre-wrap; }

.toast { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%) translateY(20px); bottom: calc(var(--nav-h) + 88px); background: #171b2c; color: white; padding: 11px 14px; border-radius: 13px; opacity: 0; pointer-events: none; transition: .22s ease; font-size: 13px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.badge { display:inline-flex; align-items:center; border-radius:999px; padding:5px 8px; font-size:10px; font-weight:900; }
.badge.paid { color:var(--success); background:var(--success-soft); }
.badge.unpaid { color:var(--warning); background:var(--warning-soft); }
.badge.cancelled { color:var(--danger); background:var(--danger-soft); }
.kicker { color: var(--muted); margin: -4px 0 12px; font-size: 13px; }
.inline-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }

@media (min-width: 640px) {
  .content { padding-inline: 22px; }
  .modal { border-radius: 28px; margin-bottom: 18px; }
  .modal-backdrop { align-items: center; padding: 20px; }
}

body.dark {
  --bg:#10131d; --surface:#171b28; --surface-2:#171b28; --text:#f2f3f8; --muted:#989daf; --line:#2a2f3d; --primary-soft:#2b2651;
  background: var(--bg);
}
body.dark .topbar { background: linear-gradient(180deg, rgba(16,19,29,.98), rgba(16,19,29,.84), rgba(16,19,29,0)); }
body.dark .bottom-nav, body.dark .icon-btn, body.dark .search, body.dark .setting-group, body.dark .setting-row, body.dark .field input, body.dark .field select, body.dark .field textarea, body.dark .profile-stat { background:#171b28; color:var(--text); }
body.dark .modal { background:#111520; }
body.dark .day-chip { background:#171b28; }
body.dark .segmented { background:#202431; }
body.dark .segmented button.active { background:#2a2f3d; color:white; }
body.dark .empty { background:#151925; }


/* TutorNote v5: groups + recurring schedules */
.people-tabs { grid-template-columns: repeat(2, 1fr); }
.group-avatar { background: #e9f5ff; color: #2873b8; font-size: 18px; }
.badge.group { color: var(--primary); background: var(--primary-soft); }
.event-chip.group-event { background: #e9f5ff; color: #286aa4; border-left-color: #3f8dcc; }

.schedule-editor {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255,255,255,.66);
  padding: 12px;
  display: grid;
  gap: 10px;
}
.schedule-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.schedule-head strong { display:block; }
.schedule-head small { display:block; color:var(--muted); margin-top:3px; line-height:1.35; }
.compact { padding:9px 11px; border-radius:12px; white-space:nowrap; }
.schedule-list { display:grid; gap:8px; }
.schedule-row {
  display:grid;
  grid-template-columns: 1fr auto;
  gap:8px;
  align-items:end;
  border:1px solid var(--line);
  border-radius:15px;
  background:white;
  padding:9px;
}
.schedule-fields { display:grid; grid-template-columns:1.25fr 1fr .72fr; gap:7px; }
.remove-slot {
  width:40px; height:40px; border:0; border-radius:12px;
  background:var(--danger-soft); color:var(--danger); font-size:22px; cursor:pointer;
}
.schedule-empty {
  color:var(--muted); font-size:12px; line-height:1.45;
  border:1px dashed var(--line); border-radius:13px; padding:10px; text-align:center;
}
.member-picker {
  display:grid; gap:7px; max-height:230px; overflow:auto;
  border:1px solid var(--line); border-radius:15px; padding:7px; background:white;
}
.member-option {
  display:flex; gap:10px; align-items:center; padding:9px;
  border-radius:12px; cursor:pointer;
}
.member-option:hover { background:var(--primary-soft); }
.member-option input { width:18px; height:18px; flex:0 0 auto; }
.member-option span { min-width:0; }
.member-option strong { display:block; }
.member-option small { display:block; color:var(--muted); margin-top:2px; }
.schedule-summary { margin-bottom:10px; }
.schedule-summary strong { display:block; margin-bottom:4px; }
.chip-list { display:flex; flex-wrap:wrap; gap:7px; }
.mini-chip {
  border:1px solid var(--line); background:white; color:var(--text);
  border-radius:999px; padding:8px 10px; font-weight:800; cursor:pointer;
}

body.dark .schedule-editor,
body.dark .schedule-row,
body.dark .member-picker,
body.dark .mini-chip { background:#171b28; color:var(--text); }

@media (max-width: 460px) {
  .schedule-fields { grid-template-columns:1fr 1fr; }
  .schedule-fields .field:last-child { grid-column:1 / -1; }
  .schedule-head { align-items:flex-start; }
}

/* TutorNote v6: calendar navigation, statuses, packages, balances */
.dashboard-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.dashboard-grid .metric-card { min-width:0; }
.dashboard-grid .metric-card strong { font-size:22px; }
.calendar-view { margin-bottom:10px; }
.calendar-nav { display:grid; grid-template-columns:44px 1fr 44px; gap:9px; align-items:center; margin-bottom:8px; }
.calendar-nav > div { text-align:center; min-width:0; }
.calendar-nav strong { display:block; font-size:17px; letter-spacing:-.02em; }
.calendar-nav small { display:block; color:var(--muted); margin-top:2px; font-size:11px; }
.nav-arrow { width:44px; height:44px; border:1px solid var(--line); border-radius:14px; background:var(--surface-2); color:var(--text); font-size:28px; line-height:1; cursor:pointer; }
.calendar-today { display:flex; justify-content:center; margin-bottom:10px; }
.day-chip { position:relative; }
.day-chip em { position:absolute; right:4px; top:4px; width:15px; height:15px; border-radius:99px; display:grid; place-items:center; font-size:8px; font-style:normal; background:var(--primary-soft); color:var(--primary); font-weight:900; }
.day-chip.active em { background:rgba(255,255,255,.18); color:white; }
.month-weekdays { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin:4px 0; }
.month-weekdays span { text-align:center; color:var(--muted); font-size:10px; font-weight:900; text-transform:uppercase; }
.month-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:15px; }
.month-day { min-height:53px; border:1px solid var(--line); border-radius:12px; background:var(--surface-2); color:var(--text); padding:6px 3px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; }
.month-day strong { font-size:13px; }
.month-day span { min-width:18px; height:18px; border-radius:99px; display:grid; place-items:center; background:var(--primary-soft); color:var(--primary); font-size:9px; font-weight:900; }
.month-day.outside { opacity:.38; }
.month-day.selected { background:var(--text); color:white; border-color:var(--text); opacity:1; }
.month-day.selected span { background:rgba(255,255,255,.18); color:white; }
.month-day.today:not(.selected) { border-color:var(--primary); box-shadow:inset 0 0 0 1px var(--primary); }
.month-picked { margin-top:2px; }
.status-dot.done { background:var(--success); }
.status-dot.no-show { background:var(--warning); }
.status-dot.moved { background:#6d7a91; }
.badge.done { color:var(--success); background:var(--success-soft); }
.badge.no-show { color:var(--warning); background:var(--warning-soft); }
.badge.moved { color:#596579; background:#edf0f5; }
.event-chip.done { background:var(--success-soft); color:#1e7454; border-left-color:var(--success); }
.event-chip.cancelled { background:var(--danger-soft); color:#9d3041; border-left-color:var(--danger); opacity:.72; }
.event-chip.moved { background:#edf0f5; color:#596579; border-left-color:#7b8799; }
.event-chip.no-show { background:var(--warning-soft); color:#8d5b17; border-left-color:var(--warning); }
.crm-stats { grid-template-columns:repeat(3,1fr); }
.positive-balance { color:var(--success); }
.negative-balance { color:var(--danger); }
.package-list { display:grid; gap:8px; }
.package-card { display:flex; justify-content:space-between; gap:10px; align-items:center; border:1px solid var(--line); background:var(--surface-2); border-radius:16px; padding:12px; }
.package-card strong, .package-card small { display:block; }
.package-card small { color:var(--muted); margin-top:3px; }
.package-card > span { font-size:11px; color:var(--muted); white-space:nowrap; font-weight:800; }

    document.addEventListener('click', async e => {
        const nav = e.target.closest('[data-page]');
        if (nav) {
            go(nav.dataset.page);
            return;
        }
        const goEl = e.target.closest('[data-go]');
        if (goEl) {
            go(goEl.dataset.go);
            return;
        }
        const dateEl = e.target.closest('[data-date]');
        if (dateEl) {
            selectedDate = dateEl.dataset.date;
            renderSchedule();
            return;
        }
        const peopleEl = e.target.closest('[data-people-view]');

            peopleView = peopleEl.dataset.peopleView || 'students';
            renderStudents();
            return;
        }
        const lessonEl = e.target.closest('[data-lesson-id]');

            const l = lessonById(lessonEl.dataset.lessonId);
            if (l)
                lessonForm(l);

        }
        const paymentEl = e.target.closest('[data-payment-id]');
        if (paymentEl) {
            paymentDetails(paymentEl.dataset.paymentId);
            return;
        }
        const range = e.target.closest('[data-range]');
        if (range) {
            paymentRange = range.dataset.range;
            renderPayments();
            return;
        }
        const actionEl = e.target.closest('[data-action]');
        if (!actionEl)
            return;
        const action = actionEl.dataset.action;
        const id = actionEl.dataset.id;
        if (action === 'close-modal') {
            closeModal();
            return;
        }
        if (action === 'today') {
            selectedDate = todayISO();
            renderSchedule();
            return;
        }
        if (action === 'set-calendar-view') {
            calendarView = actionEl.dataset.view || 'week';
            renderSchedule();
            return;
        }
        if (action === 'calendar-day') {
            calendarView = 'day';
            renderSchedule();
            return;
        }
        if (action === 'prev-period' || action === 'next-period') {
            const dir = action === 'next-period' ? 1 : -1;
            const d = new Date(`${selectedDate}T12:00:00`);
            if (calendarView === 'month') { d.setDate(1); d.setMonth(d.getMonth() + dir); }
            else d.setDate(d.getDate() + dir * (calendarView === 'week' ? 7 : 1));
            selectedDate = isoFromDate(d);
            renderSchedule();
            return;
        }
        if (action === 'add-lesson') {
            closeModal();
            lessonForm();
            return;
        }
        if (action === 'add-student') {
            closeModal();
            studentForm();
            return;
        }
        if (action === 'add-group') {
            closeModal();
            groupForm();
            return;
        }
        if (action === 'add-payment') {
            closeModal();
            paymentForm();
            return;
        }
        if (action === 'add-schedule-row') {
            const editor = actionEl.closest('.schedule-editor');
            const list = editor && $('.schedule-list', editor);
            if (list) {
                list.insertAdjacentHTML('beforeend', scheduleSlotRow());
                const empty = $('.schedule-empty', editor);
                if (empty) empty.remove();
            }
            return;
        }
        if (action === 'remove-schedule-row') {
            const row = actionEl.closest('.schedule-row');
            const editor = actionEl.closest('.schedule-editor');
            if (row) row.remove();
            const list = editor && $('.schedule-list', editor);
            if (editor && list && !list.children.length && !$('.schedule-empty', editor)) {
                list.insertAdjacentHTML('afterend', '<div class="schedule-empty">Розклад не задано. Натисніть «＋ Час», щоб додати регулярне заняття.</div>');
            }
            return;
        }
        if (action === 'edit-student') {
            const s = studentById(id);
            closeModal();
            studentForm(s);
            return;
        }
        if (action === 'edit-group') {
            const g = groupById(id);
            closeModal();
            groupForm(g);
            return;
        }
        if (action === 'add-lesson-student') {
            const s = studentById(id);
            closeModal();
            lessonForm(null, { studentId: s.id, date: selectedDate || todayISO(), time: '16:00', duration: 60, subject: s.subject || '', price: s.rate || 0, status: 'planned', paid: false, notes: '' });
            return;
        }
        if (action === 'add-lesson-group') {
            const g = groupById(id);
            closeModal();
            lessonForm(null, { groupId: g.id, studentId: '', date: selectedDate || todayISO(), time: '16:00', duration: 60, subject: g.subject || '', price: groupExpectedPrice(g), status: 'planned', paid: false, notes: '' });
            return;
        }
        if (action === 'add-payment-student') {
            closeModal();
            paymentForm(null, id);
            return;
        }
        if (action === 'add-payment-group') {
            closeModal();
            paymentForm(null, '', '', id);
            return;
        }
        if (action === 'add-package') {
            closeModal();
            packageForm(id);
            return;
        }
        if (action === 'reschedule-lesson') {
            const l = lessonById(id);
            closeModal();
            rescheduleForm(l);
            return;
        }
        if (action === 'edit-payment') {
            const p = paymentById(id);
            closeModal();
            paymentForm(p);
            return;
        }
        if (action === 'pay-lesson') {
            const l = lessonById(id);
            closeModal();
            paymentForm(null, l.studentId, l.id);
            return;
        }
        if (action === 'apply-schedule-next' || action === 'apply-schedule-all' || action === 'cancel-schedule-change') {
            const p = pendingRecurringChange;
            if (!p) { closeModal(); return; }
            const entity = p.kind === 'group' ? groupById(p.id) : studentById(p.id);
            if (!entity) { pendingRecurringChange = null; closeModal(); return; }
            if (action === 'apply-schedule-all') {
                Object.assign(entity, p.data, { weeklySchedule: p.newSchedule, scheduleStart: p.newStart });
                const result = syncRecurringLessons(p.kind, entity.id, p.newSchedule, p.newStart, entity, true);
                refreshFutureSeriesPricing(p.kind, entity.id, entity);
                save('Зміна всього майбутнього регулярного розкладу');
                pendingRecurringChange = null; if (p.kind === 'group') peopleView = 'groups'; closeModal(); render();
                toast(`Майбутній розклад оновлено • ${result.created} занять${result.skipped ? ` • ${result.skipped} накладок` : ''}`);
                return;
            }
            Object.assign(entity, p.data, { weeklySchedule: p.oldSchedule, scheduleStart: p.oldStart });
            let result = { changed: 0, skipped: 0 };
            if (action === 'apply-schedule-next') result = applyNextOnlyScheduleChange(p.kind, entity, p.oldSchedule, p.newSchedule);
            refreshFutureSeriesPricing(p.kind, entity.id, entity);
